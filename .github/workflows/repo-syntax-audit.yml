name: Repository Python Syntax Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/**/*.py
      - .github/workflows/repo-syntax-audit.yml

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile every Python script
        run: python -m compileall -q scripts
