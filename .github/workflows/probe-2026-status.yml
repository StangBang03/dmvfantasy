name: Audit ESPN 2026 Season Status

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_2026_status.py
      - .github/workflows/probe-2026-status.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-2026-status
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Inspect current 2026 season status and stats
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_2026_status.py
      - name: Upload 2026 status audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-2026-status-audit
          path: artifacts/season_2026_status/
          if-no-files-found: warn
          retention-days: 30
