name: Probe ESPN Matchup Period Split

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_matchup_period_split.py
      - .github/workflows/probe-matchup-period-split.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-matchup-period-split
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests python-dotenv
      - name: Probe matchup-period scoring splits
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_matchup_period_split.py
      - name: Upload matchup split probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-matchup-split-probe
          path: artifacts/matchup_split/
          if-no-files-found: warn
          retention-days: 30
