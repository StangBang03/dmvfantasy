name: Probe ESPN Athlete Gamelogs

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_athlete_gamelog.py
      - .github/workflows/probe-athlete-gamelog.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-athlete-gamelog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests python-dotenv
      - name: Probe NFL athlete gamelogs and league settings
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_athlete_gamelog.py
      - name: Upload athlete gamelog probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-athlete-gamelog-probe
          path: artifacts/athlete_gamelog/
          if-no-files-found: warn
          retention-days: 30
