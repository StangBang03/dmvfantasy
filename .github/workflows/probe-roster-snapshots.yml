name: Probe ESPN Historical Roster Snapshots

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_roster_snapshots.py
      - .github/workflows/probe-roster-snapshots.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-roster-snapshots
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Compare roster snapshots by scoring period
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_roster_snapshots.py
      - name: Upload roster snapshot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-roster-snapshot-audit
          path: artifacts/roster_snapshots/
          if-no-files-found: warn
          retention-days: 30
