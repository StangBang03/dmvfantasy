name: Collect Legacy Defensive Player Gamelogs

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - data/raw/legacy_game_summaries/**
      - scripts/collect_legacy_defensive_player_gamelogs.py
      - .github/workflows/collect-legacy-defensive-player-gamelogs.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: collect-legacy-defensive-player-gamelogs
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Collect defensive player game logs for rostered fantasy defenses
        run: python scripts/collect_legacy_defensive_player_gamelogs.py
      - name: Commit compact defensive gamelog data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/legacy_defensive_gamelogs/
          if ! git diff --cached --quiet; then
            git commit -m "Add legacy defensive player gamelogs"
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git checkout --theirs -- data/raw/legacy_defensive_gamelogs/
              git add -f data/raw/legacy_defensive_gamelogs/
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No defensive gamelog changes to commit"
          fi
      - name: Upload defensive gamelog audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-defensive-player-gamelogs
          path: artifacts/legacy_defensive_gamelogs/
          if-no-files-found: warn
          retention-days: 30
