name: Probe ESPN Event-Level Team Statistics

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_event_team_statistics.py
      - .github/workflows/probe-event-team-statistics.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - run: python scripts/probe_event_team_statistics.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-team-statistics-probe
          path: artifacts/event_team_statistics_probe/
          retention-days: 30
