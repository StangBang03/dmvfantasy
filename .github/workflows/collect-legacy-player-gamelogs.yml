name: Collect Legacy ESPN Player Gamelogs

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - data/raw/playercard_history/**\n      - scripts/collect_legacy_player_gamelogs.py
      - scripts/analyze_legacy_gamelog_reconciliation.py
      - .github/workflows/collect-legacy-player-gamelogs.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: collect-legacy-player-gamelogs
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Collect historical player game logs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_legacy_player_gamelogs.py
      - name: Reconcile gamelog totals against player-card season totals
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/analyze_legacy_gamelog_reconciliation.py
      - name: Commit compressed legacy gamelogs to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/legacy_player_gamelogs/
          if ! git diff --cached --quiet; then
            git commit -m "Add verified legacy ESPN player gamelogs"
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git checkout --theirs -- data/raw/legacy_player_gamelogs/
              git add -f data/raw/legacy_player_gamelogs/
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No legacy gamelog archive changes to commit"
          fi
      - name: Upload legacy player gamelog audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-player-gamelogs
          path: |
            artifacts/legacy_player_gamelogs/
            artifacts/legacy_gamelog_reconciliation/
          if-no-files-found: warn
          retention-days: 30
