name: Probe ESPN Team Defense Stats

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_team_defense_stats.py
      - .github/workflows/probe-team-defense-stats.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-team-defense-stats
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Probe team defensive stats endpoints
        run: python scripts/probe_team_defense_stats.py
      - name: Upload team defense probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-team-defense-probe
          path: artifacts/team_defense/
          if-no-files-found: warn
          retention-days: 30
