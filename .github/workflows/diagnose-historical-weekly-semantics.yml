name: Diagnose Historical Weekly Scoring Semantics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/diagnose_historical_weekly_semantics.py
      - .github/workflows/diagnose-historical-weekly-semantics.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-historical-weekly-semantics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests python-dotenv
      - name: Diagnose ESPN weekly scoring semantics
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/diagnose_historical_weekly_semantics.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-semantics-diagnostic
          path: artifacts/weekly_semantics/
          if-no-files-found: warn
          retention-days: 30
