name: Collect Legacy ESPN Game Summaries

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - data/raw/legacy_player_gamelogs/**
      - scripts/collect_legacy_game_summaries.py
      - .github/workflows/collect-legacy-game-summaries.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: collect-legacy-game-summaries
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Collect game summaries for every known player and fantasy defense
        run: python scripts/collect_legacy_game_summaries.py
      - name: Commit compact historical game summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/legacy_game_summaries/
          if ! git diff --cached --quiet; then
            git commit -m "Add compact legacy ESPN game summaries"
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git checkout --theirs -- data/raw/legacy_game_summaries/
              git add -f data/raw/legacy_game_summaries/
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No legacy game summary changes to commit"
          fi
      - name: Upload legacy game summary audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-game-summaries
          path: artifacts/legacy_game_summaries/
          if-no-files-found: warn
          retention-days: 30
