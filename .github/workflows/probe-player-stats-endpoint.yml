name: Probe ESPN Player Stats Endpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/probe_player_stats_endpoint.py
      - .github/workflows/probe-player-stats-endpoint.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-player-stats-endpoint
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests python-dotenv
      - name: Probe player weekly stats endpoints
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_player_stats_endpoint.py
      - name: Upload endpoint probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-player-stats-endpoint-probe
          path: artifacts/player_stats_endpoint/
          if-no-files-found: warn
          retention-days: 30
