name: Full Historical Player Data Pipeline Audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/build_player_performance_candidate.py
      - scripts/check_player_performance_candidate.py
      - scripts/reconstruct_legacy_player_weeks.py
      - .github/workflows/full-historical-player-pipeline.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: full-historical-player-data-pipeline
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install collection dependencies
        run: python -m pip install --upgrade pip requests
      - name: Compile the scripts used by this pipeline
        run: |
          python -m py_compile \
            scripts/collect_playercard_history.py \
            scripts/collect_legacy_player_gamelogs.py \
            scripts/collect_legacy_game_summaries.py \
            scripts/collect_legacy_defensive_player_gamelogs.py \
            scripts/validate_playercard_season_totals.py \
            scripts/reconstruct_legacy_player_weeks.py \
            scripts/audit_player_coverage.py \
            scripts/build_player_performance_candidate.py \
            scripts/check_player_performance_candidate.py

      - name: Collect expanded player-card history and legacy weekly lineups
        id: playercard
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_playercard_history.py

      - name: Collect legacy player game logs
        id: gamelogs
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_legacy_player_gamelogs.py

      - name: Collect legacy game summaries and scoring-play score states
        id: summaries
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_legacy_game_summaries.py

      - name: Collect legacy defensive player and team gamelogs
        id: defense
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_legacy_defensive_player_gamelogs.py

      - name: Validate player-card season scoring and modern weekly totals
        id: scoring
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/validate_playercard_season_totals.py

      - name: Reconstruct legacy weekly points and reconcile to ESPN matchup totals
        id: legacy
        continue-on-error: true
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/reconstruct_legacy_player_weeks.py

      - name: Audit all known player-ID sources
        id: coverage
        continue-on-error: true
        run: python scripts/audit_player_coverage.py

      - name: Build quarantined production-schema candidate
        id: candidate
        if: always()
        run: python scripts/build_player_performance_candidate.py

      - name: Commit refreshed raw source archives to audit branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/playercard_history/ data/raw/legacy_player_gamelogs/ data/raw/legacy_game_summaries/ data/raw/legacy_defensive_gamelogs/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh audited historical ESPN source archives"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No raw source archive changes"
          fi

      - name: Upload full historical data audit and candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-historical-player-data-audit
          path: |
            artifacts/player_card_history/
            artifacts/legacy_player_gamelogs/
            artifacts/legacy_game_summaries/
            artifacts/legacy_defensive_gamelogs/
            artifacts/playercard_scoring_validation/
            artifacts/legacy_weekly_reconstruction/
            artifacts/legacy_gamelog_reconciliation/
            artifacts/player_coverage/
            artifacts/player_performance_candidate/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce production-readiness gate
        if: always()
        run: python scripts/check_player_performance_candidate.py
