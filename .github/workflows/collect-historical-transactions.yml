name: Collect Historical Transactions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/collect_transactions.py
      - scripts/build_transaction_events.py
      - .github/workflows/collect-historical-transactions.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect-historical-transactions
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests python-dotenv

      - name: Collect ESPN transactions (2011-2025)
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_transactions.py

      - name: Rebuild transaction events
        run: python scripts/build_transaction_events.py

      - name: Commit transaction data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/transaction_events.json data/processed/supplemental_trade_events.json
          if git diff --cached --quiet; then
            echo "No transaction data changes to commit."
          else
            git commit -m "Add historical transaction activity through 2017"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site/data/analytics _site/data/processed
          cp -R frontend/. _site/
          cp -R data/analytics/. _site/data/analytics/
          cp -R data/processed/. _site/data/processed/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
