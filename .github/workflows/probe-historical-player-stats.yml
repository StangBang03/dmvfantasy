name: Probe Historical Player Stats

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-historical-player-stats
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests python-dotenv

      - name: Probe ESPN historical weekly stats
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_historical_player_stats.py
