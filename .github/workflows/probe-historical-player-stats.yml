name: Probe Historical Player Stats

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/probe_historical_player_stats.py
      - .github/workflows/probe-historical-player-stats.yml

permissions:
  contents: read

concurrency:
  group: probe-historical-player-stats
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests python-dotenv

      - name: Run full historical weekly audit
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_historical_player_stats.py

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-weekly-audit
          path: artifacts/historical_weekly_audit/
          if-no-files-found: warn
          retention-days: 30
