name: Probe Legacy ESPN Trades

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/audit_all_trades.py
      - .github/workflows/probe-legacy-trades.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests python-dotenv
      - name: Probe player-card transaction history
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/audit_all_trades.py
