name: Collect ESPN Player Card History (Read Only)

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/collect_playercard_history.py
      - .github/workflows/collect-playercard-history.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: collect-playercard-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests
      - name: Collect player-card history
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/collect_playercard_history.py
      - name: Commit compressed raw player-card archives to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/playercard_history/
          if ! git diff --cached --quiet; then
            git commit -m "Add verified ESPN player-card history archives"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          else
            echo "No player-card archive changes to commit"
          fi
      - name: Upload player-card history audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-card-history-collection
          path: artifacts/player_card_history/
          if-no-files-found: warn
          retention-days: 30
