name: Probe ESPN Historical Player Cards

on:
  workflow_dispatch:
  push:
    branches:
      - audit/historical-player-data
    paths:
      - scripts/probe_kona_playercard.py
      - .github/workflows/probe-kona-playercard.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-kona-playercard
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip requests python-dotenv
      - name: Probe historical player card stats
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python scripts/probe_kona_playercard.py
      - name: Upload player card probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: espn-player-card-probe
          path: artifacts/player_card/
          if-no-files-found: warn
          retention-days: 30
