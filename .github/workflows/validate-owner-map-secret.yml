name: Validate Private Owner Map

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: owner-map-validation
    env:
      ESPN_OWNER_MAP_JSON: ${{ secrets.ESPN_OWNER_MAP_JSON }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        with:
          python-version: "3.12"

      - name: Validate private owner map
        run: python scripts/validate_owner_map_secret.py
